name: Verify skill
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.10'
            node: '20'
          - python: '3.12'
            node: '22'
          - python: '3.14'
            node: '24'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check runtime and bundled assets
        run: python skills/reference-guard/scripts/reference_guard.py doctor
      - name: Run offline regression tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s skills/reference-guard/scripts/tests -v
